// build.gradle
plugins {
    id 'java'
    id 'application'
}

group = 'com.hermes'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

application {
    mainClass = 'com.hermes.controlcenter.app.HermesControlCenterApp'
    applicationName = 'Hermes Control Center'
}

dependencies {
    // UI
    implementation 'com.formdev:flatlaf:3.5.4'
    implementation 'com.formdev:flatlaf-intellij-themes:3.5.4'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation 'ch.qos.logback:logback-classic:1.5.6'

    // JSON for config persistence
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    // Test
    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Build a runnable fat JAR
jar {
    manifest {
        attributes 'Main-Class': 'com.hermes.controlcenter.app.HermesControlCenterApp'
        attributes 'Implementation-Title': 'Hermes Control Center'
        attributes 'Implementation-Version': '1.0.0'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
